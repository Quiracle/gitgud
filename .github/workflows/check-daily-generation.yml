name: Check daily generation

on:
  pull_request:
    paths:
      - '.github/workflows/check-daily-generation.yml'
      - '.github/workflows/refill-daily-puzzles.yml'
      - 'src/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.*'

permissions:
  contents: read

jobs:
  verify:
    # Keep this standard-runner check free if repository visibility changes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daily-generation-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Install isolated SQL test runtime
        run: npm install --prefix daily-review.local/sql-runtime --no-save --package-lock=false @electric-sql/pglite@0.5.12
      - name: Check queue migration and privileges
        run: node scripts/check-procedural-migration.mjs
      - name: Check refill CLI and private log boundary
        run: node scripts/check-refill-worker.mjs
      - name: Check publication through the migration chain
        run: node scripts/check-procedural-publication.mjs
      # No hosted database, provider credentials, caches, or artifact uploads.
